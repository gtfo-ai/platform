name: image

# technical/11 § Workflows. Builds every image this repository ships, on **native** runners for both
# architectures, merges them into one manifest list per image, and attests what it published.
#
# Four things are deliberate.
#
# **The build itself is `scripts/build-images.mjs`, not YAML.** That script knows which Dockerfile
# makes which image, what each is built `FROM`, and what each may weigh. A second copy of that in a
# workflow is a second list to keep true (standing rule 7), and the one in the script is also what a
# developer and the e2e tier run.
#
# **A pull request builds and never pushes.** It is the same build, with the size check, so a
# Dockerfile that cannot build or an image that grew past its budget fails the pull request — and
# nothing reaches a registry from an unreviewed branch.
#
# **Signing needs no secret.** `actions/attest-build-provenance` uses the workflow's OIDC identity
# against Sigstore's public instance, so this repository — which has no secrets at all — can still
# publish a verifiable provenance attestation. `gh attestation verify oci://<image> --repo <repo>`
# is what an operator runs.
#
# **A version is a retag, never a build** (WP-71; TD-019's amendment of 2026-09-16, Q96). Every push
# to `main` is the release; once an administrator turns versioning on, the `version` job computes
# `X.Y.Z` from the conventional commits since the last `vX.Y.Z` tag (`scripts/version.mjs`), the
# build stamps it into the image, and the `release` job — after the manifest lists exist — points
# `X.Y.Z`, `X.Y` and `X` at the manifest list **this run** built and cuts the tag and the GitHub
# Release. There is no `push: tags` trigger any more and no tag arm in the tag computation: a
# version tag reaches the registry by exactly one route, so no version can be built twice, and
# `latest` has exactly one definition in this file — the newest push to `main`.
#
# **The switch is `vars.RELEASE_VERSIONING == 'enabled'`**, a repository variable an administrator
# sets (`CONTRIBUTING.md` § Repository settings). It is unset, so this workflow creates **no tag and
# no release** — Q96's "one human switch before the first cut". The gate is in the `release` job's
# `if:` and in the step that computes the version, and `scripts/release.test.ts` fails when either
# stops naming it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes to `main` queue rather than cancel, so two runs never compute a version at once: the
# second one's `version` job starts after the first run's tag exists. GitHub keeps one *pending* run
# per group, so a third push can replace a queued second — whose commits are then in the third's
# range, because a version is computed from everything since the last tag, not from one push.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

# Every job is bounded, as in `ci.yml` (WP-126): three times the median of the last 40 runs on
# `main`, floor ten, never below twice the slowest; the figures are on each `timeout-minutes` line.
jobs:
  # **The version this push releases, or none** — computed before the build so the image reports it
  # at `GET /api/version`, and passed to the `release` job so both halves use one answer.
  #
  # It runs on every event, and computes only on a push to `main` with the switch on; everywhere else
  # its output is empty and the build is stamped `0.0.0-edge+<sha>` as before. Running it always,
  # rather than skipping the job, is deliberate: a job whose `needs` contains a skipped job is itself
  # skipped unless its `if:` uses a status function, and that would have to be repeated on every job
  # below — a rule GitHub documents and this repository cannot run offline.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10 # WP-126: 0.1 min median, 0.4 max
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # Full history *and tags*: `version.mjs` refuses a shallow clone, which would otherwise
      # compute the first version again on every push after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency is installed — the script is plain Node — so there is no package cache to
      # restore, and restoring one into a job that feeds a release is what zizmor's cache-poisoning
      # audit exists for.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: next
        name: compute the version (only on a push to main, only when versioning is enabled)
        env:
          RELEASE_VERSIONING: ${{ vars.RELEASE_VERSIONING }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] \
            && [ "${RELEASE_VERSIONING:-}" = "enabled" ]; then
            node scripts/version.mjs --github-output
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "no version for this run: versioning is '${RELEASE_VERSIONING:-unset}' (the switch is RELEASE_VERSIONING=enabled), event ${GITHUB_EVENT_NAME}, ref ${GITHUB_REF}"
          fi

  build:
    name: build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15 # WP-126: 3.2 min median, 5.2 max (amd64; arm64 2.9 and 4.2)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository's Node, not the runner's (WP-118 follow-up). Every step below is a plain
      # Node script, and until this step they ran on the runner image's default interpreter, Node
      # 22.23.3. Its bundled undici 6.28.1 compiles the HTTP parser asynchronously on the first
      # connection and attaches the socket listeners only afterwards, so a peer that closes that
      # connection first is never observed: the request stays pending with no handle behind it and
      # Node exits 13 on an unsettled top-level await. `docker-proxy` does exactly that to the
      # first `/healthz` probe before the app listens, which is how `web-compose-check` failed.
      # Node 24's undici compiles it synchronously. No dependency is installed, hence no cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Build metadata the image reports at `GET /api/version` (`runtime.ts` § buildInfo): the
      # version the `version` job computed when this push releases one, `0.0.0-edge+<sha>` otherwise.
      - id: meta
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          version="${RELEASE_VERSION:-0.0.0-edge+${short}}"
          {
            echo "version=${version}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "short=${short}"
          } >> "$GITHUB_OUTPUT"

      # Every image, base first, each held to its own budget. `--size-check` is what technical/11
      # asks for; the budgets, the quantity they bound and their derivation are in the script.
      #
      # The three variables are read by the script and passed on as **build arguments**: `docker
      # build` does not forward the environment to an `ARG`, so an earlier version of this step
      # published images that reported `0.0.0-dev` and `commit: null` at `GET /api/version`. The
      # script now refuses a build whose image did not take them.
      - name: build and size-check every image
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_COMMIT: ${{ steps.meta.outputs.commit }}
          APP_BUILT_AT: ${{ steps.meta.outputs.built_at }}
        run: node scripts/build-images.mjs --tag ci --size-check

      # WP-15j's criterion 8, and the only place it can be measured: that `docker compose up`
      # serves the SPA at `/` and the API at `/api` from **this** image. It runs here rather than in
      # `ci.yml` because this is the job with a daemon *and* with the image already built — the
      # check takes `--no-build` and `--tag ci`, so it starts the artefact this workflow will
      # publish rather than a second build of the same tree. Both architectures run it: the bundle
      # is architecture-independent, but the path inside the image and the process that reads it
      # are not something to assume on one of two runners.
      #
      # The compose project name carries the run id, the attempt and the architecture, and since
      # WP-126 the project's default network is its own (`<project>_default`), so its containers,
      # volumes and `db` are not another job's on a shared daemon; the daemon chooses the published
      # port (`APP_PORT=0`) and the script reads it back. The script tears its own project down in a
      # `finally`, and the step below repeats it unconditionally because a killed step has no
      # `finally`.
      - name: serve the SPA from the image just built
        run: >-
          node scripts/web-compose-check.mjs --tag ci --no-build
          --project-suffix ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      # WP-50's live half, and the only place it can be measured either: that a stock `.env` — the
      # operator guide's `cp .env.example .env` plus the values §2 names, and **no override file** —
      # reaches a created integration, an authenticated `/metrics` and an instance configured with
      # only `APP_SECRET_KEY_FILE`. It needs a daemon *and* both images, which is this job and not
      # `ci.yml`'s e2e job (that one builds `platform-runtime` and `platform-egress` only). The
      # compose-file half of the same row is asserted client-side in the e2e tier. Since WP-133 it
      # also starts a second project with `compose.local.yml` (BD-004's `local` mode, a fake token,
      # the `-lm` project torn down below): app, runner and launcher healthy, the runner composing an
      # agent runner, a run's environment carrying the token by name, and each stop inside its grace.
      - name: a stock instance of the image just built creates an integration
        run: >-
          node scripts/compose-stock-check.mjs --tag ci
          --project-suffix ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      # WP-126 (PROGRESS backlog 347): two projects from `compose.yml` on this one daemon at once,
      # and each `app` resolves `db` to, and connects to, its own database. Until WP-126 the file
      # pinned the default network's name, so every project joined one network and `db` answered
      # with any of their databases; the canary in PROGRESS.md under WP-126 is this check failing
      # by name on that file.
      - name: two instances on one daemon reach their own databases
        run: >-
          node scripts/compose-isolation-check.mjs --tag ci
          --project-suffix ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      # The scripts tear their own projects down in a `finally`; these repeat it unconditionally.
      # Every command below ends `|| true` on purpose: this is cleanup after the verdict, and a
      # teardown that fails must not turn a green build red or hide a red one — it is silent where
      # the old single step failed the job, which is the trade. The scripts' own `finally` is the
      # teardown that reports. No `APP_SECRET_KEY` is needed for the teardown: WP-50 removed the
      # `${APP_SECRET_KEY:?…}` interpolation that used to make even a `down` require a value.
      - name: tear down the compose projects
        if: always()
        run: |
          set -eu
          suffix=ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          for project in agentic-web-check-"${suffix}" agentic-stock-check-"${suffix}" \
            agentic-stock-check-"${suffix}"-lm \
            agentic-isolation-check-"${suffix}"-a agentic-isolation-check-"${suffix}"-b; do
            # `ctl` and `repo-cache` are named globally in compose.yml, so every check gives them
            # `<project>-ctl`/`<project>-repo-cache` (`composeEnvironment`); the `down` names the
            # same, or interpolating /dev/null would name the defaults instead.
            APP_WORKSPACE_CONTROL_VOLUME="${project}-ctl" \
              APP_WORKSPACE_CACHE_VOLUME="${project}-repo-cache" \
              docker compose -p "${project}" --env-file /dev/null -f compose.yml \
              down -v --remove-orphans || true
            docker volume rm -f "${project}-ctl" "${project}-repo-cache" >/dev/null 2>&1 || true
          done

      - name: log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One per-architecture tag per image; the manifest lists are merged in the next job. A digest
      # would be tidier, but the tag is what `imagetools create` can take without passing a value
      # between jobs for every one of five images.
      - name: push the per-architecture images
        if: github.event_name != 'pull_request'
        env:
          SHORT: ${{ steps.meta.outputs.short }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          for image in platform-base platform-runtime platform-egress platform platform-launcher; do
            target="${REGISTRY}/${owner}/${image}:sha-${SHORT}-${ARCH}"
            docker tag "${image}:ci" "${target}"
            docker push "${target}"
          done

  merge:
    name: manifest list (${{ matrix.image }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # WP-126: 0.5 min median, 1.0 max
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [platform-base, platform-runtime, platform-egress, platform, platform-launcher]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `sha-<7>`, `edge` **and `latest`** on `main`; `sha-<7>` **and nothing else** on any other
      # ref. The version tags are not here: the `release` job applies them to the manifest list this
      # step creates, after it exists (see the header).
      #
      # **`latest` is the newest push to `main`** — TD-019's amendment of 2026-09-16, the product
      # owner's continuous-deployment decision. It supersedes that record's original "never
      # `latest` in docs" clause and Q89's recommendation to stop publishing it: every push to
      # `main` is reviewed, verified by six targets and published here on two architectures, which
      # is what makes it the release. **This is the only definition of `latest` in this file**:
      # until WP-71 a tag arm published a second one ("the newest version tag"), and WP-71 removed
      # the arm with the `push: tags` trigger that reached it — so `latest` and the newest version
      # tag point at the same manifest list whenever the newest push to `main` cut a version, and
      # `latest` runs ahead of the version tags whenever it did not (a `docs:` push).
      #
      # **The branch arm is guarded on the ref, and the guard is the whole of the claim.** This job
      # is gated only on `github.event_name != 'pull_request'` and this workflow declares
      # `workflow_dispatch`, so "not a pull request" is **not** the same as "a push to `main`": a
      # manual dispatch on a feature branch — or on a tag — reaches this step, and without the guard
      # it would publish `latest` and `edge` from code nobody reviewed. `GITHUB_REF` is compared
      # rather than `GITHUB_REF_NAME`, because a *tag* named `main` would match the name. Any other
      # ref gets `sha-<7>` alone — the artefact is still built, published and attested, and is
      # addressable by exactly the name that identifies the commit it came from.
      #
      # **`edge` follows the same rule as `latest`, deliberately.** Before this guard `edge` meant
      # "the last thing that ran this workflow", which is the hazard Q89 filed; both names are
      # *moving pointers an operator pulls*, and a moving pointer that can be moved from a branch
      # nobody reviewed is the defect whichever of the two it is. Keeping `edge` loose to preserve
      # a dispatch habit would leave exactly half the hole open.
      #
      # **Residual, stated rather than discovered**: a **re-run** of this workflow at an older
      # `main` commit, or a dispatch on `main` at an older sha, moves `latest` *backwards*. It is
      # not refused here, because a re-run is an operator's deliberate act on a commit that *was*
      # on `main` — the artefact is genuine and re-publishing it is sometimes the point (a
      # registry-side transient is re-run three times in this project's own log). What is lost is
      # the "newest" in *newest push to `main`*, and the recovery is the same act: re-run the head.
      # Refusing it would need this job to compare `GITHUB_SHA` with the branch's current head,
      # which is a second API read and a race of its own.
      - id: merge
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          repo="${REGISTRY}/${owner}/${{ matrix.image }}"
          short="${GITHUB_SHA::7}"
          tags="sha-${short}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags} edge latest"
          fi
          refs=""
          for tag in ${tags}; do refs="${refs} -t ${repo}:${tag}"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create ${refs} \
            "${repo}:sha-${short}-amd64" "${repo}:sha-${short}-arm64"
          digest=$(docker buildx imagetools inspect "${repo}:sha-${short}" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')
          {
            echo "repo=${repo}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

      # The digest is the manifest list's, which is what a `docker pull` of any tag above resolves
      # to. No secret is involved: the identity is the workflow's OIDC token (see the header).
      - name: attest the provenance of the published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.merge.outputs.repo }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # The digest this leg merged and attested, handed to the `release` job as a file: a matrix job
      # has one set of outputs for all its legs, so five digests cannot travel as job outputs
      # without each leg's value depending on which finished last. The `release` job copies **this**
      # digest, never whatever `sha-<7>` points at when it runs.
      - name: record the digest this run built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/${IMAGE}"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  # **The version this push released: a tag on each manifest list, then the git tag and the GitHub
  # Release** (WP-71; TD-019's amendment, Q96).
  #
  # **Off until an administrator turns it on.** `vars.RELEASE_VERSIONING == 'enabled'` is Q96's one
  # human switch before the first cut: an unset repository variable reads as the empty string, so
  # this job is skipped on every push until somebody decides that `0.1.0` is real
  # (`CONTRIBUTING.md` § Repository settings). The `version` job's step tests the same variable, so
  # removing it from either place still leaves the other — and `scripts/release.test.ts` fails on
  # either removal.
  #
  # **A retag, never a build — of the digest this run attested.** The `merge` legs hand this job the
  # five digests they merged and attested (an artifact per image). Before anything is published,
  # each is compared with what `sha-<7>` points at **now**: a dispatch at the same commit on another
  # ref runs in another concurrency group and can have moved that tag, and then nothing is copied.
  # The copy is made **from the digest** (`<repo>@sha256:…`), so it cannot pick up a moved tag
  # between the check and the copy either. `imagetools create` with one manifest-list source
  # "performs a carbon copy" (https://docs.docker.com/reference/cli/docker/buildx/imagetools/create/);
  # afterwards all three version tags are read back and must carry that digest, because the
  # provenance attestation is stored against it. A read-back mismatch can only fail **after** the
  # tags moved — the step says so, and the release is not cut.
  #
  # **The order is chosen for a re-run.** Images first, release last: a failure between them leaves
  # version tags and no release, and a re-run repeats the (idempotent) copies and then cuts it. The
  # other order would leave a release whose images do not exist.
  #
  # `GITHUB_TOKEN` may create a tag and a release (only pull requests are refused — Q90's
  # measurement, run 34966305421); a tag it creates starts no workflow, which is why this file no
  # longer has a `push: tags` trigger for it to start.
  release:
    name: release
    needs: [version, merge]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.RELEASE_VERSIONING == 'enabled' && needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10 # WP-126: never run: RELEASE_VERSIONING is unset, so this is the floor, not a measurement
    permissions:
      # The tag and the GitHub Release.
      contents: write
      # The version tags on the five manifest lists.
      packages: write
    steps:
      # Full history and tags: the notes are the range since the previous release tag, and the
      # upgrade note compares its migrations with this build's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      # The release body is `pnpm changelog --release-notes`: the upgrade note, product/14's exit
      # criteria and the commits since the previous release. Nothing commits it (Q96 (3)), and the
      # script refuses a version that is not ahead of the newest release tag.
      - name: render the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/changelog.mjs --release-notes --version "${VERSION}" > "${RUNNER_TEMP}/notes.md"

      - name: tag the images and cut the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tag of this name that `HEAD` does not contain — made by hand, on another branch — is
          # not something to release over: `gh release create` would attach the release to *that*
          # tag and ignore `--target`.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists and HEAD does not carry it as its release; refusing to cut it again" >&2
            exit 1
          fi
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          short="${GITHUB_SHA::7}"
          notes="${RUNNER_TEMP}/notes.md"
          images="platform-base platform-runtime platform-egress platform platform-launcher"
          inspect() {
            docker buildx imagetools inspect "$1" --format '{{ json .Manifest.Digest }}' | tr -d '"'
          }

          # 1. Every source first, before anything is published: the digest this run attested, and
          #    `sha-<7>` still pointing at it.
          for image in ${images}; do
            repo="${REGISTRY}/${owner}/${image}"
            built=$(cat "${RUNNER_TEMP}/digests/${image}" 2>/dev/null || true)
            if ! printf '%s' "${built}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "no digest recorded for ${image} by this run's merge job (got '${built}'); nothing was copied" >&2
              exit 1
            fi
            current=$(inspect "${repo}:sha-${short}")
            if [ "${current}" != "${built}" ]; then
              echo "${repo}:sha-${short} is ${current:-nothing}, not ${built}, the digest this run built and attested; nothing was copied" >&2
              exit 1
            fi
          done

          # 2. Copy by digest, then read all three tags back.
          {
            echo ''
            echo '### Images'
            echo ''
            echo "Each is a manifest list for amd64 and arm64 with a provenance attestation (\`gh attestation verify oci://<image> --repo ${GITHUB_REPOSITORY}\`), at the digest built as \`sha-${short}\`."
            echo ''
          } >> "${notes}"
          for image in ${images}; do
            repo="${REGISTRY}/${owner}/${image}"
            digest=$(cat "${RUNNER_TEMP}/digests/${image}")
            docker buildx imagetools create \
              -t "${repo}:${VERSION}" -t "${repo}:${VERSION%.*}" -t "${repo}:${VERSION%%.*}" \
              "${repo}@${digest}"
            for tag in "${VERSION}" "${VERSION%.*}" "${VERSION%%.*}"; do
              copied=$(inspect "${repo}:${tag}")
              if [ "${copied}" != "${digest}" ]; then
                echo "${repo}:${tag} is ${copied:-nothing} after the copy, not ${digest}: not a retag. The version tags of ${image} have already moved; the release is not cut" >&2
                exit 1
              fi
            done
            echo "- \`${repo}:${VERSION}\` — \`${digest}\`" >> "${notes}"
          done
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" \
            --notes-file "${notes}"
