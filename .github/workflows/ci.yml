name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Reproducible installs; the store is restored by setup-node's pnpm cache.
  CI: 'true'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every static check `pnpm run -s verify` runs, as one command derived from the same table
      # (scripts/verify-targets.ts): biome, the generated JSON Schemas, the .gitignore guard, the
      # NUL-byte guard, the merge-conflict-marker guard, the third-party notices check and
      # technical/03 held to the migrations' tables (WP-97). Listing
      # them here instead was a second
      # copy of the list, and it had
      # drifted — `ignored:check` was in `verify` and in no CI job at all, so a guard that had
      # already caught two live defects gated nothing on a push. `scripts/verify.test.ts` fails
      # when a target or group in that table is not run by this workflow.
      - run: pnpm run -s verify:static

      # **The three linters over the CI surface itself** (WP-71, backlog 117; TD-017, research/09).
      # Each is a container image pinned by **digest** — `docker://…@sha256:…`, the `uses:` form
      # `scripts/release.test.ts` holds to the same pin rule as every action — and none is a step of
      # `verify`, because each needs a container runtime `verify` does not assume. The first run over
      # the tree they land on found 16 zizmor findings, 23 hadolint findings and no actionlint
      # finding; all were fixed or waived with a reason before this job existed, so it lands green
      # (the counts and every waiver are in PROGRESS.md under WP-71). `scripts/release.test.ts`'s
      # SHA-pin check **stays**: it is the cheaper of the two and holds on the day a tool is skipped.
      #
      # actionlint: workflow syntax, expressions, `runs-on` labels and shellcheck over every `run:`
      # block (the image carries shellcheck). It finds the workflows itself.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # zizmor: template injection, token scope, credential persistence and cache poisoning — and,
      # online, whether each pinned SHA is really a commit of the action it names (impostor-commit),
      # which the pin regex cannot see. **Findings fail the job** (the first of the two decisions
      # backlog 117 asked to be stated rather than defaulted): at the default persona there were
      # 16, every one was fixed rather than waived, and a new one is a change to fix or to waive at
      # its line with `# zizmor: ignore[<audit>]` and a reason. The `auditor` persona's 13 extra
      # notes (10 template expansions of trusted contexts, 3 permissions without a comment) are not
      # gated. The token is this job's read-only `GITHUB_TOKEN`, for the online audits' API reads.
      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 # 1.30.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress .
      # hadolint over every Dockerfile git tracks — the list is held to `docker/*.Dockerfile` in both
      # directions by `scripts/release.test.ts`, because the image has no shell to expand a glob. The
      # second decision, which rules are waived for images that already pin by digest, is
      # `.hadolint.yaml`: two rules for the corpus, each with its reason, and every other waiver at
      # its line.
      - name: hadolint
        uses: docker://hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
        with:
          entrypoint: /bin/hadolint
          args: docker/app.Dockerfile docker/base.Dockerfile docker/egress.Dockerfile docker/launcher.Dockerfile docker/runtime.Dockerfile

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run -s verify:types

  bundle:
    name: bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds apps/web and measures the initial graph dist/index.html requests against
      # TD-013's 300 kB gzipped budget. A step of `verify` (scripts/verify-targets.ts),
      # so it cannot be added there and forgotten here.
      - run: pnpm run -s verify:bundle

  unit:
    name: unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/changelog.test.ts reads this repository's own history (release.test.ts did too until
          # CHANGELOG.md became a pointer, backlog 257); a shallow clone gave them one commit (2788e9c:
          # "expected 1 to be greater than 100").
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The coverage run, then the coverage ratchet over the figures it just wrote (WP-97): the
      # ratchet runs here because this is where coverage is measured, and it refuses a summary
      # written before this step started.
      - run: pnpm run -s verify:tests
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run -s verify:ui

  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser binary is not in the pnpm store, so it is installed explicitly. Only
      # Chromium: the suite asserts application behaviour against a fake API and a fake SSE
      # backend, not rendering differences between engines.
      - name: install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run -s verify:web-e2e
      - name: upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers reaches the runner's Docker daemon and starts one
      # PostgreSQL 18 for the whole project (test/integration/support).
      # TEST_DATABASE_URL would point the suite at an external server instead.
      - run: pnpm run -s verify:integration

  e2e:
    name: e2e-fake-claude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The two images the workspace e2e runs the real provider against
      # (`test/e2e/workspace/docker-workspace.e2e.test.ts`): `platform-runtime`
      # as the run container, `platform-egress` as the sidecar. They are built
      # here rather than pulled, so the tier tests **this commit's** images —
      # and a missing image fails the suite rather than skipping a case, which
      # is WP-22's criterion (PROGRESS backlog 27).
      # No `--size-check` here: the budgets are `image.yml`'s job, and measuring an unpacked image
      # size costs this tier nothing it needs.
      - name: build the run images this tier needs
        run: node scripts/build-images.mjs runtime egress
      # TD-025's Docker verification, against the image that ships the shim
      # rather than against a bind-mounted checkout. Not a `verify` target: it
      # needs a daemon, which only this job has.
      - name: the run shim works in the image it ships in
        env:
          # Without this the check falls back to WP-13's arrangement — `node:24-alpine` with the
          # repository bind-mounted at `/repo` — which is the thing the image exists to replace.
          RUNLET_CHECK_RUNTIME_IMAGE: platform-runtime:dev
        run: node scripts/runlet-container-check.mjs
      # Starts whole `apps/server` instances against the same Testcontainers
      # PostgreSQL 18 the integration tier uses, and runs the workspace tier
      # against the real daemon.
      - run: pnpm run -s verify:e2e

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gitleaks (full history)
        run: pnpm run -s secrets:scan:ci

  # The two commit gates run on every trigger this workflow has, not on pull_request only:
  # this project pushes straight to `main`, and an `if: github.event_name == 'pull_request'`
  # reported `skipped` — a green tick — on every push, so neither gate ever ran. The range is
  # resolved from the event payload by scripts/commits.mjs (before..after on a push, base..head
  # on a pull request or merge group); a range it cannot determine is a failure, not a pass.
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both gates walk a commit range, which a shallow clone cannot answer for.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run -s verify:commitlint

  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The check itself needs only git and node, but pnpm 12 installs before running a script
      # when node_modules is missing; the frozen install keeps that explicit and reproducible.
      - run: pnpm install --frozen-lockfile
      - name: every commit carries a Signed-off-by trailer matching its author
        run: pnpm run -s verify:dco
