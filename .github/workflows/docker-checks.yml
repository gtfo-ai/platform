name: docker checks

# The `scripts/*-check.mjs` that need a Docker daemon and were run only by hand: CI runs them now, so
# a change no longer depends on a developer's daemon (technical/11 § Docker checks in CI). Which run
# when is **one table**, `scripts/docker-checks.mjs`: four on every pull request and push to `main`,
# three only when a path they guard changed, and all seven every night and on a dispatch.
#
# **One build, handed to every check.** The `images` job builds the five images once (amd64), saves
# them as one zstd archive and uploads it; each check job loads it and runs one check, all in
# parallel. `image.yml`'s build is not reused: a job here cannot `needs:` a job of another workflow,
# and moving these jobs into `image.yml` would put them behind both architectures' build legs and
# their four compose checks, and put a nightly trigger beside the jobs that publish `latest`.
#
# **None of these jobs is a required check** (CONTRIBUTING.md § Branch protection is `ci.yml`'s
# jobs, held by `scripts/release.test.ts`): a required check a path list skipped would block every
# pull request it skipped, and a scheduled run has no pull request. A failure is a red `docker check
# (<name>)` on the pull request or push; a scheduled run's failure is a red run on the Actions page,
# and GitHub e-mails whoever last edited the `schedule` line. Not a `verify` target either: `verify`
# runs where there is no daemon.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every check, every night, so a change no path list named is caught within a day.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# As `ci.yml`: a pull request's newer run cancels its older one; every push and every scheduled run
# runs to the end.
concurrency:
  group: docker-checks-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'newest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the floor: 9 s and 14 s in the first two runs (PR #45)
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff needs the pull request's base, or the push's previous head.
          fetch-depth: 0
      # No dependency is installed — the script is plain Node — so there is no cache to restore.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The changed files of a pull request (since its merge base) or of a push; anything else — a
      # schedule, a dispatch, a push whose previous head is unknown (a new branch, a force push) —
      # runs every check, because a list that cannot be computed is not an empty list.
      - id: plan
        name: the checks this change runs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            range="${PR_BASE}...${PR_HEAD}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            range="${PUSH_BEFORE}...${GITHUB_SHA}"
          fi
          changed="${RUNNER_TEMP}/changed-files"
          if [ -n "${range}" ] && git diff --name-only "${range}" > "${changed}"; then
            node scripts/docker-checks.mjs plan --changed "${changed}" --github-output
          else
            node scripts/docker-checks.mjs plan --all --github-output
          fi

  images:
    name: docker images
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # the floor: 1.8 and 1.8 min in the first two runs (PR #45)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Tagged `:dev`, every check's default, so no check needs a flag to find them. No
      # `--size-check`: the budgets are `image.yml`'s.
      - name: build every image
        run: node scripts/build-images.mjs
      # One `docker save` for the five, so the layers they share are stored once.
      - name: save the images
        run: |
          set -euo pipefail
          docker save platform-base:dev platform-runtime:dev platform-egress:dev platform:dev \
            platform-launcher:dev | zstd -T0 -3 -q -o "${RUNNER_TEMP}/images.tar.zst"
          ls -l "${RUNNER_TEMP}/images.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-images
          path: ${{ runner.temp }}/images.tar.zst
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          # "Re-run failed jobs" re-runs this one too, and a second upload of the name is refused.
          overwrite: true
          retention-days: 1

  check:
    name: docker check (${{ matrix.check }})
    needs: [plan, images]
    if: needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # slowest leg worker-update-check, 6.3 min green (x3 = 19); a red one took 28 min to
    # end on its own phase bounds and print its FAIL line, so 30. Others 1.0-5.9 min (PR #45)
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    env:
      # Three checks refuse to default it (standing rule 55); this is the runner's own daemon.
      DOCKER_HOST: unix:///var/run/docker.sock
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Most checks import the TypeScript sources, and several mount the checkout, `node_modules`
      # included, into a container.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-images
          path: ${{ runner.temp }}/images
      - name: load the images
        run: |
          set -euo pipefail
          zstd -d -q -c "${RUNNER_TEMP}/images/images.tar.zst" | docker load
      - name: run the check
        run: node scripts/docker-checks.mjs run "${CHECK}"
