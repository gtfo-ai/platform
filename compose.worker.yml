# A remote worker (BD-032): one compose file and nothing else (BD-032 decision 9, TD-032 decision 3).
#
#   mkdir agentic-worker && cd agentic-worker
#   curl -fsSo compose.yaml https://<core>/api/worker/v1/compose.yml
#   docker compose up -d
#   open http://127.0.0.1:7357   # this machine's page: sign in to Claude, approve the machine
#
# The download is public and needs no header (TD-031's 2026-11-05 amendment): it holds no secret,
# and the file the core serves already names `APP_CORE_URL`. Saved as `compose.yaml` in a folder of
# its own, no `-f` is needed. **Nothing else is required** (WP-294, TD-031's 2026-11-05 first-run
# amendment): with no `APP_CORE_URL` the page asks for the platform, with no
# `CLAUDE_CODE_OAUTH_TOKEN` it runs Claude's own sign-in (`claude setup-token`, from the
# `claude-cli` volume below), and it shows the device code to approve — large, with a link that
# opens the platform's approval page with the code filled in. Each value set here wins over the
# page, which then says so.
#
# **This file is a template baked into the `platform` image** at `/opt/platform/compose.worker.yml`
# (`docker/app.Dockerfile`). The core renders it for a first install (`GET /api/worker/v1/compose.yml`,
# WP-284): every `${PLATFORM_*_IMAGE:-…}` default below becomes the core's own image **by digest**
# and `${APP_CORE_URL:-…}` the core's URL — the variables stay, so the updater's managed `.env` block
# (TD-032 decision 4, WP-287) can re-pin them. A worker follows its core's digests, never `latest`.
# `scripts/worker-compose-check.mjs` brings this file up against a core on one daemon.
#
# ## What is deliberate
#
# **The worker holds no database, no instance secret key and no integration secret** (BD-032
# decision 1): `remote-worker` is refused at start if `DATABASE_URL` or `APP_SECRET_KEY` reaches it,
# so nothing here passes an `env_file`. Its one secret of its own is the developer's
# Claude token, which goes into the CLI's environment of each run and nowhere else (BD-032 decision
# 2): `CLAUDE_CODE_OAUTH_TOKEN` here, or — when that is empty — the one the page's sign-in stores as
# `claude-token` (0600) in the `worker-state` volume.
#
# **The networks are the core's (TD-028).** `docker-socket-proxy` is the only service with the
# Docker socket, on an `internal: true` network only the launcher joins; the launcher's control plane
# is on a second `internal: true` network only it and `remote-worker` join, with no published port.
# `remote-worker` also joins `default`, its route to the core over HTTPS (BD-032 decision 11) — its
# local listener (`/readyz`, `/internal/drain`, `/internal/state`) is **not published** and is reached
# on this compose network only.
#
# **The worker's local page is published on loopback only** (WP-292, TD-031's worker-UI amendment §1):
# `127.0.0.1:${APP_WORKER_UI_PORT:-7357}:7357` — never a bare port, which Docker publishes on every host
# address (research/17 § 10). It opens at `http://127.0.0.1:7357` with **no token** by default
# (`APP_WORKER_UI_AUTH=none`, TD-031's 2026-11-05 no-bearer amendment); on a machine with more than one
# OS account set `APP_WORKER_UI_AUTH=token`, and the address carries a token (`#token=…`) printed at
# every start — delete `ui-token` in the `worker-state` volume to change it. `APP_WORKER_UI=disabled`
# opens no port. A run container joins only its per-run networks, so no run can reach it.
#
# **The Claude CLI the page's sign-in runs is the run image's own** (TD-031's first-run amendment §4):
# the `pull-runtime-image` one-shot copies `/usr/local/bin/claude` into the `claude-cli` volume, which
# `remote-worker` mounts read-only — the exact CLI runs execute, with no Docker client in the worker.
# `extra_hosts` maps `host.docker.internal` on Linux too, so the page can offer a platform running on
# this machine (`:8080`, `:5173`, and `APP_WORKER_CORE_CANDIDATES`).
#
# **The launcher applies the `relayed` carriage** (TD-031's 2026-11-04 amendment, backlog 693): a
# deploy key never reaches this machine; the mirror and export helpers sign through a helper agent
# socket the worker serves on the `ctl` volume and forwards to the core.
#
# **The launcher token is generated at first start** (`launcher-token`, a one-shot of the platform
# image): 32 random bytes on a volume only the launcher and the worker mount, kept across restarts.
#
# **Its volumes and run network have their own names**, so a worker and a core can share one daemon
# (the Docker check does) without one's `ctl` volume or run network being the other's. A second
# worker on the same machine sets `APP_WORKER_CONTROL_VOLUME`, `APP_WORKER_CACHE_VOLUME`,
# `APP_WORKER_RUN_NETWORK` and `APP_WORKER_UI_PORT` (and its own project name).
#
# **It updates itself** (`updater`, WP-287): it follows the core's digests, verifying each build's
# attestation first, and keeps them in a marked block of the env file beside this one (`.env`, or the
# `--env-file` you passed). See the `updater` service below for what it does and how to turn it off.

name: agentic-worker

services:
  launcher-token:
    image: ${PLATFORM_IMAGE:-platform:dev}
    command: ['apps/server/src/remote-worker/launcher-token.ts', '/var/lib/platform/launcher-token/token']
    volumes:
      - launcher-token:/var/lib/platform/launcher-token
    network_mode: none
    restart: 'no'

  # **The images a run needs are pulled by `up`, never by the launcher** (TD-031 decision 4: a launcher
  # never pulls at create). Each of these one-shots names one of them and exits at once, so `docker
  # compose up` pulls the run, egress and git-helper images on a clean machine before the launcher
  # starts — the first install works with nothing pre-pulled, and an updater that re-pins a digest
  # gets it pulled by its own `up` (TD-032 decision 6). `true` is in all three images.
  # It also copies the run image's `claude` into the `claude-cli` volume (WP-294): as root, because a
  # fresh volume is root's, and the copy keeps the binary's 0755 so the worker's user can run it.
  pull-runtime-image:
    image: ${PLATFORM_RUNTIME_IMAGE:-platform-runtime:dev}
    entrypoint: ['cp', '/usr/local/bin/claude', '/opt/claude-cli/claude']
    user: '0'
    volumes:
      - claude-cli:/opt/claude-cli
    network_mode: none
    restart: 'no'

  pull-egress-image:
    image: ${PLATFORM_EGRESS_IMAGE:-platform-egress:dev}
    entrypoint: ['true']
    network_mode: none
    restart: 'no'

  pull-git-image:
    image: ${APP_WORKSPACE_GIT_IMAGE:-alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26}
    entrypoint: ['true']
    network_mode: none
    restart: 'no'

  remote-worker:
    image: ${PLATFORM_IMAGE:-platform:dev}
    environment:
      ROLE: remote-worker
      # Both optional (WP-294): empty, the worker's page asks for each and keeps it in worker-state.
      APP_CORE_URL: ${APP_CORE_URL:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      APP_WORKER_CORE_CANDIDATES: ${APP_WORKER_CORE_CANDIDATES:-}
      APP_WORKER_CLAUDE_CLI: /opt/claude-cli/claude
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY:-1}
      # Seconds a usage limit that named no reset time pauses claiming (TD-031 decision 11).
      APP_WORKER_USAGE_PAUSE_DEFAULT: ${APP_WORKER_USAGE_PAUSE_DEFAULT:-3600}
      APP_WORKER_STATE_DIR: /var/lib/platform/worker-state
      APP_LAUNCHER_URL: http://launcher:7780
      APP_LAUNCHER_TOKEN_FILE: /var/lib/platform/launcher-token/token
      APP_WORKSPACE_CONTROL_ROOT: /run/agentic/ctl
      # The image references the worker reports holding, by digest (TD-031 decision 4).
      PLATFORM_IMAGE: ${PLATFORM_IMAGE:-platform:dev}
      PLATFORM_LAUNCHER_IMAGE: ${PLATFORM_LAUNCHER_IMAGE:-platform-launcher:dev}
      PLATFORM_RUNTIME_IMAGE: ${PLATFORM_RUNTIME_IMAGE:-platform-runtime:dev}
      PLATFORM_EGRESS_IMAGE: ${PLATFORM_EGRESS_IMAGE:-platform-egress:dev}
      HOST: 0.0.0.0
      PORT: 8080
      # The local page (WP-292): on, and the host port its address names (the `Host` it checks).
      APP_WORKER_UI: ${APP_WORKER_UI:-enabled}
      APP_WORKER_UI_PORT: ${APP_WORKER_UI_PORT:-7357}
      # `none`: no token, the page at http://127.0.0.1:7357; `token` for a shared machine.
      APP_WORKER_UI_AUTH: ${APP_WORKER_UI_AUTH:-none}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${APP_WORKER_UI_PORT:-7357}:7357'
    volumes:
      - worker-state:/var/lib/platform/worker-state
      - launcher-token:/var/lib/platform/launcher-token:ro
      - ctl:/run/agentic/ctl
      - claude-cli:/opt/claude-cli:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Group 0, so the run's helper agent socket can be `<uid>:0` `0660` — what the mirror helper (root,
    # no capabilities) reaches, as WP-279 measured (backlog 705).
    group_add: ['0']
    networks:
      - default
      - launcher-api
    depends_on:
      launcher-token:
        condition: service_completed_successfully
      pull-runtime-image:
        condition: service_completed_successfully
      launcher:
        condition: service_started
    # A stop hands every run back (`shutdown`), which settles each through the core.
    stop_grace_period: 60s
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    restart: unless-stopped

  launcher:
    image: ${PLATFORM_LAUNCHER_IMAGE:-platform-launcher:dev}
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      APP_LAUNCHER_DEPLOY_KEY_CARRIAGE: relayed
      APP_LAUNCHER_TOKEN_FILE: /var/lib/platform/launcher-token/token
      APP_LAUNCHER_PORT: 7780
      APP_WORKSPACE_CONTROL_VOLUME: ${APP_WORKER_CONTROL_VOLUME:-agentic-worker-ctl}
      APP_WORKSPACE_CONTROL_ROOT: /run/agentic/ctl
      APP_WORKSPACE_CACHE_VOLUME: ${APP_WORKER_CACHE_VOLUME:-agentic-worker-repo-cache}
      APP_WORKSPACE_RUNTIME_IMAGE: ${PLATFORM_RUNTIME_IMAGE:-platform-runtime:dev}
      APP_WORKSPACE_EGRESS_IMAGE: ${PLATFORM_EGRESS_IMAGE:-platform-egress:dev}
      APP_WORKSPACE_GIT_IMAGE: ${APP_WORKSPACE_GIT_IMAGE:-alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26}
      APP_WORKSPACE_MIRROR_MEMORY_MB: ${APP_WORKSPACE_MIRROR_MEMORY_MB:-2048}
      APP_WORKSPACE_HELPER_NETWORK: ${APP_WORKER_RUN_NETWORK:-agentic-worker-run-egress}
      APP_WORKSPACE_EGRESS_NETWORK: ${APP_WORKER_RUN_NETWORK:-agentic-worker-run-egress}
      APP_WORKSPACE_EXPORT_DIR: /var/lib/app/exports
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ctl:/run/agentic/ctl
      - launcher-token:/var/lib/platform/launcher-token:ro
      - exports:/var/lib/app/exports
    networks:
      - docker-proxy
      - run-egress
      - launcher-api
    depends_on:
      launcher-token:
        condition: service_completed_successfully
      pull-runtime-image:
        condition: service_completed_successfully
      pull-egress-image:
        condition: service_completed_successfully
      pull-git-image:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
    stop_grace_period: 60s
    restart: unless-stopped

  # **The updater** (WP-287, TD-032 decisions 3, 4 and 6): follows the core's digests by itself. Every
  # 5 minutes (and on a 426 the worker reports) it asks the core's `release`, **verifies every advertised
  # digest's build attestation** against the identity below — configured here, never served by the core
  # — refuses a downgrade, pulls, drains the worker, waits until it is idle, and starts a one-shot
  # `update-apply` container from the **new** image, which re-pins the four `PLATFORM_*_IMAGE` lines in a
  # managed block of this project's env file (the previous file kept as `.env.previous`), brings the
  # worker up with the template **that image carries**, checks `core_handshake`, rolls back if it does
  # not come up, reports to the core, and recreates this container last. A fork sets the two trusted
  # variables to its own repository and workflow; unset, this worker refuses to self-update by name.
  #
  # **It is root-equivalent on this machine** (TD-032 §4): it reaches Docker through its own socket
  # proxy, which filters by API path and not by project. Keeping to this project is its code's
  # property — every Compose call passes `--project-name`. It runs as root to read the worker's
  # credential; its apply container runs as root to write the env file in the directory you ran
  # `docker compose` from (mounted at the same path), and hands the file back to that directory's
  # owner. Remove this service (and `updater-docker-proxy`) to update by hand: re-download
  # the compose file from the core and `docker compose up -d`.
  updater:
    image: ${PLATFORM_IMAGE:-platform:dev}
    user: '0:0'
    environment:
      ROLE: updater
      # Not required here: a worker started before it knows its core (S-22.17's first-run page) has an
      # updater that waits. The core's rendered file defaults it to the core, as the worker's.
      APP_CORE_URL: ${APP_CORE_URL:-}
      APP_TRUSTED_IMAGE_REPOSITORY: ${APP_TRUSTED_IMAGE_REPOSITORY:-ghcr.io/gtfo-ai/platform}
      APP_TRUSTED_BUILDER: ${APP_TRUSTED_BUILDER:-gtfo-ai/platform/.github/workflows/image.yml@refs/heads/main}
      # Where a registry is read from (a mirror); every read is by digest, so not a trust decision.
      APP_UPDATE_REGISTRY_ENDPOINTS: ${APP_UPDATE_REGISTRY_ENDPOINTS:-}
      APP_UPDATE_POLL_SECONDS: ${APP_UPDATE_POLL_SECONDS:-300}
      APP_UPDATE_CHECK_SECONDS: ${APP_UPDATE_CHECK_SECONDS:-120}
      APP_WORKER_LOCAL_URL: http://remote-worker:8080
      APP_WORKER_STATE_DIR: /var/lib/platform/worker-state
      APP_UPDATE_STATE_DIR: /var/lib/platform/updates
      DOCKER_HOST: tcp://updater-docker-proxy:2375
      # The four references this worker runs: what an advertised update is compared with.
      PLATFORM_IMAGE: ${PLATFORM_IMAGE:-platform:dev}
      PLATFORM_LAUNCHER_IMAGE: ${PLATFORM_LAUNCHER_IMAGE:-platform-launcher:dev}
      PLATFORM_RUNTIME_IMAGE: ${PLATFORM_RUNTIME_IMAGE:-platform-runtime:dev}
      PLATFORM_EGRESS_IMAGE: ${PLATFORM_EGRESS_IMAGE:-platform-egress:dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The worker credential `release` and `update-report` carry; read-only.
      - worker-state:/var/lib/platform/worker-state:ro
      - updates:/var/lib/platform/updates
    networks:
      - default
      - updater-docker
    depends_on:
      updater-docker-proxy:
        condition: service_started
      remote-worker:
        condition: service_started
    restart: unless-stopped

  # The updater's own Docker access (TD-032 §4): a second proxy, on a network only the updater and its
  # apply container join — never the launcher's. `CONTAINERS NETWORKS VOLUMES IMAGES INFO POST`, the
  # set research/17 § 5 names for Compose (TODO V-WM2, measured by `scripts/worker-update-check.mjs`).
  updater-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      INFO: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - updater-docker
    restart: unless-stopped

volumes:
  worker-state:
  launcher-token:
  claude-cli:
  exports:
  updates:
  ctl:
    name: ${APP_WORKER_CONTROL_VOLUME:-agentic-worker-ctl}

networks:
  run-egress:
    # Named globally (the launcher is handed it by name); `APP_WORKER_RUN_NETWORK` gives a second
    # bundle on the same daemon its own, as `APP_WORKER_CONTROL_VOLUME` gives it its own volume.
    name: ${APP_WORKER_RUN_NETWORK:-agentic-worker-run-egress}
  docker-proxy:
    internal: true
  launcher-api:
    internal: true
  updater-docker:
    internal: true
