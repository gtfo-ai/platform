# Git hooks (technical/11 hygiene). Installed by `pnpm install` via the root
# `prepare` script. Local binaries are invoked directly rather than through
# `pnpm exec`, which triggers an implicit install check on every hook run.
#
# The secret scan runs with --require, so it fails closed when neither the
# gitleaks binary nor Docker is available: a scan that did not run is never
# reported as a pass (BD-002). The only way past it is the explicit and noisy
# GITLEAKS_SKIP=1, which CI ignores. Skip all hooks once with LEFTHOOK=0 or
# `git commit --no-verify` — never to get past an actual secret finding.
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: node scripts/gitleaks.mjs git --staged --require
    - name: biome
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}'
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --edit {1}

# The merge-conflict guard runs here as well as in `verify`/CI because pre-push is the hook that
# decides what reaches `origin`, and the defect it exists for (d1e7b69: markers in CLAUDE.md, on
# `main` for an hour) came in through a merge commit made with `--no-verify` — which is sometimes
# the right thing to do mid-merge, and skips pre-commit only. CI is the backstop, but this project
# pushes straight to `main`, so CI's verdict arrives after the broken tree is public. It costs
# ~0.15s over the 734 tracked files — measured by driving the hook itself — against the minutes
# the test job below takes, and it runs first so the cheap verdict comes first.
pre-push:
  jobs:
    - name: merge-conflict markers
      run: pnpm run -s conflict:check
    - name: unit + contract
      run: pnpm run -s test
